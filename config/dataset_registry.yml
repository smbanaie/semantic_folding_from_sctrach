# ============================================================
# Dataset Parameter Registry
# ============================================================
defaults:
  grid_size: 64
  smoothing_sigma: 1.5
  method: umap
  umap_n_neighbors: 15
  umap_min_dist: 0.0
  umap_metric: cosine
  perplexity: 50
  spreading_steps: 1
  top_percent: 0.1
  weighting: idf
  doc_norm: l2
  use_morton: true
  splade: true
  splade_alpha: 0.3
  cross_attention: false
  block_size: 8
  attention_temperature: 1.0
  snippet_ranking: false
  snippet_window: 3
  snippet_stride: 2
  adaptive_spreading: false
  normalize_after_spreading: false
  spreading_decay: 0.5
  normalization: l2
  oov_expansion: false
  synonym_weight: 0.5
  max_doc_freq: 20
belebele:
  description: Reading comprehension across 122 languages (English subset)
  max_queries: 200
  splade: true
  splade_alpha: 0.3
  fusion_method: rrf
  rrf_k: 60
  perplexity: 50
  doc_norm: l2
