<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 980 150" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    .step { fill: #f3f4f6; stroke: #374151; stroke-width: 1.5; }
    .compute { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
    .decide { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
    .out { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
    .label { font-size: 13px; fill: #111827; }
    .sublabel { font-size: 10.5px; fill: #4b5563; }
    .titletxt { font-size: 15px; fill: #111827; font-weight: 600; }
    .caption { font-size: 11px; fill: #6b7280; font-style: italic; }
    line, path.edge { stroke: #374151; stroke-width: 1.4; fill: none; marker-end: url(#arrow3); }
  </style>
  <rect x="20" y="43" width="140" height="60" rx="8" class="step"/>
  <text x="90" y="68" text-anchor="middle" class="label" style="white-space: pre; font-size: 13px;">Retriever A</text>
  <text x="90" y="85" text-anchor="middle" class="label" style="white-space: pre; font-size: 13px;">Retriever B</text>
  <path class="edge" d="M 160 73 L 210 73"/>
  <rect x="210" y="38" width="170" height="70" rx="8" class="compute"/>
  <text x="295" y="63" text-anchor="middle" class="label" style="white-space: pre; font-size: 13px;">Compute score</text>
  <text x="295" y="80" text-anchor="middle" class="label" style="white-space: pre; font-size: 13px;">geometries G_A, G_B</text>
  <text x="295" y="96" text-anchor="middle" class="sublabel" style="white-space: pre; font-size: 10.5px;">(Definition 1, §3.1)</text>
  <path class="edge" d="M 380 73 L 430 73"/>
  <rect x="430" y="28" width="190" height="90" rx="8" class="compute"/>
  <text x="525" y="51" text-anchor="middle" class="label" style="white-space: pre; font-size: 13px;">Assemble Hybrid</text>
  <text x="525" y="68" text-anchor="middle" class="label" style="white-space: pre; font-size: 13px;">Compatibility profile</text>
  <text x="525" y="85" text-anchor="middle" class="sublabel" style="white-space: pre; font-size: 10.5px;">τ, RRF-recoverability,</text>
  <text x="525" y="100" text-anchor="middle" class="sublabel" style="white-space: pre; font-size: 10.5px;">task topology (Definition 3, §5)</text>
  <path class="edge" d="M 620 73 L 670 73"/>
  <rect x="670" y="38" width="160" height="70" rx="8" class="decide"/>
  <text x="750" y="63" text-anchor="middle" class="label" style="white-space: pre; font-size: 13px;">Apply decision</text>
  <text x="750" y="80" text-anchor="middle" class="label" style="white-space: pre; font-size: 13px;">rule (Figure 4)</text>
  <text x="750" y="96" text-anchor="middle" class="sublabel" style="white-space: pre; font-size: 10.5px;">proposed, not validated</text>
  <path class="edge" d="M 830 73 L 880 73"/>
  <rect x="880" y="43" width="80" height="60" rx="8" class="out"/>
  <text x="920" y="68" text-anchor="middle" class="label" style="white-space: pre; font-size: 13px;">Operator</text>
  <text x="920" y="85" text-anchor="middle" class="label" style="white-space: pre; font-size: 13px;">choice</text>
</svg>